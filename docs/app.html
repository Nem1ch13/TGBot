<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Всё под рукой</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #1a1a1a;
            --sub: #6b7280;
            --accent: #3b82f6;
            --accent-light: #eff6ff;
            --border: #e5e7eb;
            --danger: #ef4444;
            --tab-active: #3b82f6;
            --tab-inactive: #9ca3af;
            --shadow: 0 4px 12px rgba(0,0,0,0.04);
            --radius: 20px;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #111827;
                --card: #1f2937;
                --text: #f3f4f6;
                --sub: #9ca3af;
                --accent: #60a5fa;
                --accent-light: #1e3a5f;
                --border: #374151;
                --shadow: 0 4px 12px rgba(0,0,0,0.3);
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
            transition: background 0.2s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 10px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .open-bot-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: opacity 0.2s;
            text-decoration: none;
        }
        .open-bot-btn:active { opacity: 0.8; }
        .card {
            background: var(--card);
            border-radius: var(--radius);
            padding: 18px;
            margin: 0 16px 12px;
            box-shadow: var(--shadow);
        }
        .weather-icon { font-size: 48px; margin-right: 12px; }
        .temp-big { font-size: 42px; font-weight: 700; }
        .feels { color: var(--sub); font-size: 14px; }
        .row { display: flex; align-items: center; flex-wrap: wrap; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .detail { font-size: 14px; color: var(--sub); }
        .detail b { color: var(--text); font-weight: 600; }
        .nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--card); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 8px 0 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .nav-btn {
            background: none; border: none; color: var(--tab-inactive);
            font-size: 11px; display: flex; flex-direction: column; align-items: center;
            gap: 4px; cursor: pointer; transition: color 0.2s; padding: 4px 8px;
        }
        .nav-btn.active { color: var(--tab-active); font-weight: 600; }
        .nav-btn svg { width: 24px; height: 24px; }
        .forecast-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        .forecast-card {
            background: var(--card);
            border-radius: 16px;
            padding: 14px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            border: 1px solid var(--border);
        }
        .forecast-date { font-size: 13px; color: var(--sub); margin-bottom: 6px; }
        .forecast-icon { font-size: 32px; margin: 4px 0; }
        .forecast-temp { font-size: 18px; font-weight: 700; margin: 4px 0; }
        .forecast-desc { font-size: 12px; color: var(--sub); text-transform: capitalize; }
        .rate-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
        .rate-table th, .rate-table td { padding: 6px 4px; text-align: right; }
        .rate-table th { color: var(--sub); font-weight: 500; border-bottom: 1px solid var(--border); }
        .rate-table td:first-child, .rate-table th:first-child { text-align: left; }
        .converter { display: flex; flex-direction: column; gap: 8px; }
        .converter input, .converter select, .converter button {
            padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 15px;
        }
        .converter button { background: var(--accent); color: white; border: none; font-weight: 600; cursor: pointer; }
        .spinner { text-align: center; padding: 40px; color: var(--sub); }
        .hidden { display: none !important; }
        canvas { margin-top: 12px; }
        .news-item {
            margin-bottom: 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }
        .news-item:last-child { border-bottom: none; }
        .news-link { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 15px; }
        .news-date { font-size: 12px; color: var(--sub); margin-top: 4px; }
        .history-item {
            padding: 6px 0;
            font-size: 14px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .history-item:last-child { border-bottom: none; }
        .history-item small { color: var(--sub); font-size: 12px; }
        .clear-history-btn {
            background: none;
            border: none;
            color: var(--danger);
            font-size: 13px;
            cursor: pointer;
            padding: 4px 8px;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 id="cityTitle">🏙 Загрузка...</h1>
        <a class="open-bot-btn" id="openBotBtn" href="#">💬 Открыть бота</a>
    </div>

    <!-- Вкладки -->
    <div id="tab-weather" class="tab-content">
        <div class="card" id="weatherCard"><div class="spinner">⏳ Загрузка...</div></div>
    </div>
    <div id="tab-forecast" class="tab-content hidden">
        <div class="card"><div id="forecastCard"><div class="spinner">⏳ Загрузка...</div></div></div>
    </div>
    <div id="tab-news" class="tab-content hidden">
        <div class="card" id="newsCard"><div class="spinner">⏳ Загрузка...</div></div>
    </div>
    <div id="tab-rates" class="tab-content hidden">
        <div class="card" id="ratesCard"><div class="spinner">⏳ Загрузка...</div></div>
    </div>
    <div id="tab-convert" class="tab-content hidden">
        <div class="card">
            <div class="converter">
                <input type="number" id="convertAmount" placeholder="Сумма" value="100">
                <select id="convertFrom">
                    <option value="RUB">🇷🇺 RUB - Рубль</option>
                    <option value="KZT">🇰🇿 KZT - Тенге</option>
                    <option value="USD">🇺🇸 USD - Доллар</option>
                    <option value="EUR">🇪🇺 EUR - Евро</option>
                    <option value="GBP">🇬🇧 GBP - Фунт</option>
                    <option value="PLN">🇵🇱 PLN - Злотый</option>
                    <option value="CNY">🇨🇳 CNY - Юань</option>
                    <option value="TRY">🇹🇷 TRY - Лира</option>
                    <option value="UAH">🇺🇦 UAH - Гривна</option>
                </select>
                <select id="convertTo">
                    <option value="KZT">🇰🇿 KZT - Тенге</option>
                    <option value="RUB">🇷🇺 RUB - Рубль</option>
                    <option value="USD">🇺🇸 USD - Доллар</option>
                    <option value="EUR">🇪🇺 EUR - Евро</option>
                    <option value="GBP">🇬🇧 GBP - Фунт</option>
                    <option value="PLN">🇵🇱 PLN - Злотый</option>
                    <option value="CNY">🇨🇳 CNY - Юань</option>
                    <option value="TRY">🇹🇷 TRY - Лира</option>
                    <option value="UAH">🇺🇦 UAH - Гривна</option>
                </select>
                <button onclick="doConvert()">Конвертировать</button>
                <div id="convertResult" style="font-weight:600; margin-top:4px;"></div>
                <div id="historyContainer" style="margin-top:12px;"></div>
            </div>
        </div>
    </div>
    <div id="tab-chart" class="tab-content hidden">
        <div class="card">
            <canvas id="tempChart" height="200"></canvas>
        </div>
    </div>

    <!-- Навигация -->
    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('weather')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7 1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91 1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg>
            Погода
        </button>
        <button class="nav-btn" onclick="switchTab('forecast')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
            Прогноз
        </button>
        <button class="nav-btn" onclick="switchTab('news')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 3l-1.67 1.67L18.67 3 17 4.67 15.33 3l-1.66 1.67L12 3l-1.67 1.67L8.67 3 7 4.67 5.33 3 3.67 4.67 2 3v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V3zM11 19H4v-6h7v6zm9 0h-7v-2h7v2zm0-4h-7v-2h7v2zm0-4H4V8h16v3z"/></svg>
            Новости
        </button>
        <button class="nav-btn" onclick="switchTab('rates')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>
            Курсы
        </button>
        <button class="nav-btn" onclick="switchTab('convert')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.65 1.87 1.96 0 2.4-.98 2.4-1.59 0-.83-.44-1.61-2.67-2.14-2.48-.6-4.18-1.62-4.18-3.67 0-1.72 1.39-2.84 3.11-3.21V4h2.67v1.95c1.86.45 2.79 1.86 2.85 3.39H14.3c-.05-1.11-.64-1.87-2.22-1.87-1.5 0-2.4.68-2.4 1.64 0 .84.65 1.39 2.67 1.91s4.18 1.39 4.18 3.91c-.01 1.83-1.38 2.83-3.12 3.16z"/></svg>
            Конвертер
        </button>
        <button class="nav-btn" onclick="switchTab('chart')">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>
            График
        </button>
    </div>

    <script>
        const WEATHER_KEY = 'b87ebb55d538c2d9213edfad793e6bef';
        const BOT_USERNAME = 'Infoofcity_bot'; // обновил!
        let currentCity = localStorage.getItem('city') || 'Almetyevsk';
        let currentCityRu = localStorage.getItem('cityRu') || 'Альметьевск';
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Кнопка "Открыть бота"
        document.getElementById('openBotBtn').addEventListener('click', function(e) {
            e.preventDefault();
            tg.openTelegramLink(`https://t.me/${BOT_USERNAME}`);
        });

        async function fetchJSON(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Network error');
            return res.json();
        }

        async function getWeather(city) {
            const data = await fetchJSON(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${WEATHER_KEY}&units=metric&lang=ru`);
            const emoji = {
                '01d':'☀️','01n':'🌙','02d':'⛅','02n':'🌙','03d':'☁','03n':'☁','04d':'☁','04n':'☁',
                '09d':'🌧','09n':'🌧','10d':'🌦','10n':'🌧','11d':'⛈','11n':'⛈','13d':'🌨','13n':'🌨','50d':'🌫','50n':'🌫'
            }[data.weather[0].icon] || '🌡';
            return {
                temp: data.main.temp,
                feels: data.main.feels_like,
                desc: data.weather[0].description,
                hum: data.main.humidity,
                wind: data.wind.speed,
                icon: emoji,
                sunrise: new Date(data.sys.sunrise * 1000).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}),
                sunset: new Date(data.sys.sunset * 1000).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'})
            };
        }

        async function getForecast(city) {
            const data = await fetchJSON(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${WEATHER_KEY}&units=metric&lang=ru`);
            const daily = {};
            data.list.forEach(item => {
                const date = item.dt_txt.split(' ')[0];
                const temp = item.main.temp;
                const icon = item.weather[0].icon;
                const desc = item.weather[0].description;
                if (!daily[date]) daily[date] = { min: temp, max: temp, icon: icon, desc: desc };
                else {
                    if (temp < daily[date].min) daily[date].min = temp;
                    if (temp > daily[date].max) daily[date].max = temp;
                }
            });
            return Object.entries(daily).slice(0, 5).map(([date, d]) => ({
                date: new Date(date).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', weekday:'short'}),
                min: d.min,
                max: d.max,
                icon: mapIcon(d.icon),
                desc: d.desc
            }));
        }

        function mapIcon(code) {
            const icons = {
                '01d':'☀️','01n':'🌙','02d':'⛅','02n':'🌙','03d':'☁','03n':'☁','04d':'☁','04n':'☁',
                '09d':'🌧','09n':'🌧','10d':'🌦','10n':'🌧','11d':'⛈','11n':'⛈','13d':'🌨','13n':'🌨','50d':'🌫','50n':'🌫'
            };
            return icons[code] || '🌡';
        }

        async function getNews(city) {
            const data = await fetchJSON(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(`https://news.google.com/rss/search?q=${encodeURIComponent(city)}&hl=ru&gl=RU&ceid=RU:ru`)}`);
            if (!data.items || !data.items.length) return [{title:'Новостей не найдено', link:'#'}];
            return data.items.slice(0, 5).map(i => ({
                title: i.title,
                link: i.link,
                date: new Date(i.pubDate).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit'})
            }));
        }

        async function getRates() {
            const data = await fetchJSON('https://api.exchangerate-api.com/v4/latest/USD');
            const r = data.rates;
            return {
                RUB: r.RUB, KZT: r.KZT, EUR: r.EUR, GBP: r.GBP,
                CNY: r.CNY, AED: r.AED, TRY: r.TRY, UAH: r.UAH,
                KGS: r.KGS, UZS: r.UZS, PLN: r.PLN
            };
        }

        async function loadWeather() {
            const w = await getWeather(currentCity);
            document.getElementById('cityTitle').textContent = `🏙 ${currentCityRu}`;
            document.getElementById('weatherCard').innerHTML = `
                <div class="row"><span class="weather-icon">${w.icon}</span><div><span class="temp-big">${w.temp.toFixed(0)}°C</span><div class="feels">Ощущается ${w.feels.toFixed(0)}°C</div></div></div>
                <div style="margin-top:10px;">☁ ${w.desc}</div>
                <div class="grid-2">
                    <div class="detail">💧 Влажность<br><b>${w.hum}%</b></div>
                    <div class="detail">💨 Ветер<br><b>${w.wind} м/с</b></div>
                    <div class="detail">🌅 Восход<br><b>${w.sunrise}</b></div>
                    <div class="detail">🌇 Закат<br><b>${w.sunset}</b></div>
                </div>`;
        }

        async function loadForecast() {
            const f = await getForecast(currentCity);
            const html = f.map(d => `
                <div class="forecast-card">
                    <div class="forecast-date">${d.date}</div>
                    <div class="forecast-icon">${d.icon}</div>
                    <div class="forecast-temp">${d.min.toFixed(0)}° … ${d.max.toFixed(0)}°</div>
                    <div class="forecast-desc">${d.desc}</div>
                </div>
            `).join('');
            document.getElementById('forecastCard').innerHTML = `<div class="forecast-grid">${html}</div>`;
        }

        async function loadNews() {
            const n = await getNews(currentCityRu);
            document.getElementById('newsCard').innerHTML = n.map(i => `
                <div class="news-item">
                    <a href="${i.link}" target="_blank" class="news-link">${i.title}</a>
                    <div class="news-date">${i.date || ''}</div>
                </div>`).join('');
        }

        async function loadRates() {
            const r = await getRates();
            const safe = (a,b) => b? a/b : 0;
            document.getElementById('ratesCard').innerHTML = `
                <table class="rate-table">
                    <tr><th>Валюта</th><th>USD</th><th>RUB</th><th>KZT</th></tr>
                    <tr><td>🇷🇺 RUB</td><td>${(1/r.RUB).toFixed(4)}</td><td>1.0000</td><td>${(1/(r.RUB/r.KZT)).toFixed(2)}</td></tr>
                    <tr><td>🇰🇿 KZT</td><td>${(1/r.KZT).toFixed(4)}</td><td>${safe(1, r.RUB/r.KZT).toFixed(4)}</td><td>1.0000</td></tr>
                    <tr><td>🇺🇸 USD</td><td>1.0000</td><td>${r.RUB.toFixed(2)}</td><td>${r.KZT.toFixed(2)}</td></tr>
                    <tr><td>🇪🇺 EUR</td><td>${r.EUR.toFixed(4)}</td><td>${safe(r.RUB, r.EUR).toFixed(2)}</td><td>${safe(r.KZT, r.EUR).toFixed(2)}</td></tr>
                    <tr><td>🇬🇧 GBP</td><td>${r.GBP.toFixed(4)}</td><td>${safe(r.RUB, r.GBP).toFixed(2)}</td><td>${safe(r.KZT, r.GBP).toFixed(2)}</td></tr>
                    <tr><td>🇵🇱 PLN</td><td>${(1/r.PLN).toFixed(4)}</td><td>${safe(r.RUB, r.PLN).toFixed(2)}</td><td>${safe(r.KZT, r.PLN).toFixed(2)}</td></tr>
                </table>`;
        }

        // ИСТОРИЯ КОНВЕРТЕРА
        function getHistory() {
            return JSON.parse(localStorage.getItem('convHistory') || '[]');
        }
        function addHistory(entry) {
            let history = getHistory();
            history.unshift(entry);
            if (history.length > 5) history.pop();
            localStorage.setItem('convHistory', JSON.stringify(history));
            renderHistory();
        }
        function clearHistory() {
            localStorage.removeItem('convHistory');
            renderHistory();
        }
        function renderHistory() {
            const container = document.getElementById('historyContainer');
            const history = getHistory();
            if (history.length === 0) {
                container.innerHTML = '<div style="color:var(--sub); font-size:14px;">История пуста</div>';
                return;
            }
            let html = '<div style="font-weight:600; margin-bottom:6px;">📋 Последние конвертации:</div>';
            history.forEach((item, index) => {
                html += `<div class="history-item"><span>${item}</span></div>`;
            });
            html += '<button class="clear-history-btn" onclick="clearHistory()">Очистить историю</button>';
            container.innerHTML = html;
        }

        async function doConvert() {
            const amount = +document.getElementById('convertAmount').value;
            const from = document.getElementById('convertFrom').value;
            const to = document.getElementById('convertTo').value;
            if (!amount || amount <= 0) {
                document.getElementById('convertResult').textContent = 'Введите положительную сумму';
                return;
            }
            try {
                const data = await fetchJSON(`https://api.exchangerate-api.com/v4/latest/${from}`);
                const rate = data.rates[to];
                const res = amount * rate;
                const resultText = `${amount} ${from} = ${res.toFixed(2)} ${to}`;
                document.getElementById('convertResult').textContent = resultText;
                addHistory(resultText);
            } catch(e) {
                document.getElementById('convertResult').textContent = 'Ошибка конвертации';
            }
        }

        let chartInstance;
        async function loadChart() {
            const f = await getForecast(currentCity);
            if (chartInstance) chartInstance.destroy();
            const ctx = document.getElementById('tempChart').getContext('2d');
            chartInstance = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: f.map(d => d.date),
                    datasets: [
                        { label: 'Мин.', data: f.map(d => d.min), borderColor: '#3b82f6', fill: false },
                        { label: 'Макс.', data: f.map(d => d.max), borderColor: '#ef4444', fill: false }
                    ]
                }
            });
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.add('hidden'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            const tabEl = document.getElementById(`tab-${tab}`);
            if (tabEl) tabEl.classList.remove('hidden');
            const btn = document.querySelector(`.nav-btn[onclick*="switchTab('${tab}')"]`);
            if (btn) btn.classList.add('active');
            if (tab === 'weather') loadWeather();
            else if (tab === 'forecast') loadForecast();
            else if (tab === 'news') loadNews();
            else if (tab === 'rates') loadRates();
            else if (tab === 'convert') { renderHistory(); } // показываем историю
            else if (tab === 'chart') loadChart();
        }

        // Первый запуск – геолокация
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(async pos => {
                try {
                    const data = await fetchJSON(`https://api.openweathermap.org/data/2.5/weather?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&appid=${WEATHER_KEY}&units=metric&lang=ru`);
                    if (data.name) {
                        currentCity = data.name;
                        currentCityRu = data.name;
                        localStorage.setItem('city', currentCity);
                        localStorage.setItem('cityRu', currentCityRu);
                    }
                } catch(e) {}
                loadWeather();
            }, () => loadWeather());
        } else loadWeather();
    </script>
</body>
</html>
