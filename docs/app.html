<html lang="ru">
<head>

    <style>
:root {
    --bg:#f4f6fb;
    --card:#ffffff;
    --text:#111827;
    --sub:#6b7280;
    --accent:#2563eb;
    --accent-light:#eaf2ff;
    --border:#e5e7eb;
    --danger:#ef4444;
    --shadow:0 8px 25px rgba(0,0,0,.06);
    --radius:26px;
}

body.dark {
    --bg:#0f172a;
    --card:#1e293b;
    --text:#f8fafc;
    --sub:#94a3b8;
    --accent:#60a5fa;
    --accent-light:#1e3a5f;
    --border:#334155;
    --shadow:0 8px 25px rgba(0,0,0,.35);
}


* {
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body {
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;

    background:var(--bg);
    color:var(--text);

    min-height:100vh;
    padding-bottom:90px;

    transition:.3s;
}



/* HEADER */

.header {

    display:flex;
    justify-content:space-between;
    align-items:center;

    padding:22px 18px 14px;

}


.header h1 {

    font-size:24px;
    font-weight:750;
    letter-spacing:-.5px;

}



.city-select-btn {

    background:var(--accent-light);

    color:var(--accent);

    border:none;

    padding:10px 15px;

    border-radius:16px;

    font-size:14px;

    font-weight:600;

}



/* CARDS */


.card {

    background:var(--card);

    border-radius:var(--radius);

    padding:20px;

    margin:0 16px 14px;

    box-shadow:var(--shadow);

    transition:.25s;

}




/* WEATHER */


.weather-main {

    text-align:center;

}


.weather-icon {

    font-size:75px;

    margin-bottom:5px;

}


.temp-big {

    font-size:70px;

    font-weight:750;

    letter-spacing:-3px;

    line-height:1;

}


.feels {

    margin-top:8px;

    color:var(--sub);

}


.weather-desc {

    font-size:20px;

    color:var(--sub);

    margin-top:5px;

}



.grid-2 {

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    margin-top:22px;

}



.detail {

    background:var(--accent-light);

    padding:13px;

    border-radius:18px;

    text-align:center;

    color:var(--sub);

}



.detail b {

    display:block;

    margin-top:5px;

    font-size:16px;

    color:var(--text);

}



/* HOURLY */


.hourly-scroll {

    display:flex;

    gap:12px;

    overflow-x:auto;

    padding-bottom:5px;

}



.hourly-item {

    min-width:75px;

    background:var(--accent-light);

    border-radius:18px;

    padding:12px 8px;

    text-align:center;

}



.hourly-icon {

    font-size:28px;

}



/* FORECAST */


.forecast-grid {

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

}


.forecast-card {

    background:var(--card);

    border:1px solid var(--border);

    border-radius:22px;

    padding:16px;

    text-align:center;

}



.forecast-icon {

    font-size:36px;

}



.forecast-temp {

    font-size:20px;

    font-weight:700;

}




/* NAV */


.nav {

    position:fixed;

    bottom:0;

    left:0;

    right:0;


    background:var(--card);

    border-top:1px solid var(--border);


    display:flex;

    justify-content:space-around;


    padding:10px 0 14px;


    backdrop-filter:blur(20px);

}



.nav-btn {

    background:none;

    border:none;

    color:#9ca3af;

    font-size:11px;

}



.nav-btn.active {

    color:var(--accent);

    font-weight:700;

}



/* MODAL */


.modal-overlay {

    position:fixed;

    inset:0;

    background:rgba(0,0,0,.45);

    display:flex;

    align-items:flex-end;

    z-index:1000;

}



.modal {

    width:100%;

    max-width:500px;

    background:var(--card);

    border-radius:30px 30px 0 0;

    padding:25px;

    max-height:80vh;

    overflow:auto;

}



.city-grid {

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

}



.city-card {

    background:var(--bg);

    border-radius:20px;

    padding:16px;

    text-align:center;

}



.city-flag {

    font-size:30px;

}



/* INPUTS */


.search-box,
.converter input,
.converter select {

    width:100%;

    padding:14px;

    border-radius:16px;

    border:1px solid var(--border);

    background:var(--bg);

    color:var(--text);

    font-size:16px;

}




.converter button {

    padding:14px;

    border-radius:18px;

    border:none;

    background:var(--accent);

    color:white;

    font-weight:700;

    font-size:16px;

}




/* SKELETON */


.skeleton {

background:
linear-gradient(
90deg,
var(--border),
var(--card),
var(--border)
);

background-size:200% 100%;

animation:loading 1.5s infinite;

}


@keyframes loading {

0%{
background-position:200% 0;
}

100%{
background-position:-200% 0;
}

}
    </style>

    <script>
        const WEATHER_KEY = 'b87ebb55d538c2d9213edfad793e6bef';
        let currentCity = localStorage.getItem('city') || 'Almetyevsk';
        let currentCityRu = localStorage.getItem('cityRu') || 'Альметьевск';
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function applyTheme() {
            if (tg.colorScheme === 'dark') document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        }
        tg.onEvent('themeChanged', applyTheme);
        applyTheme();

        function cacheGet(key, maxAgeMs = 15 * 60 * 1000) {
            const raw = localStorage.getItem(key);
            if (!raw) return null;
            try {
                const { data, ts } = JSON.parse(raw);
                if (Date.now() - ts < maxAgeMs) return data;
            } catch(e) {}
            return null;
        }
        function cacheSet(key, data) {
            localStorage.setItem(key, JSON.stringify({ data, ts: Date.now() }));
        }

        async function fetchJSON(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Network error');
            return res.json();
        }

        async function getWeather(city) {
            const data = await fetchJSON(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${WEATHER_KEY}&units=metric&lang=ru`);
            const emoji = {'01d':'☀️','01n':'🌙','02d':'⛅','02n':'🌙','03d':'☁','03n':'☁','04d':'☁','04n':'☁','09d':'🌧','09n':'🌧','10d':'🌦','10n':'🌧','11d':'⛈','11n':'⛈','13d':'🌨','13n':'🌨','50d':'🌫','50n':'🌫'}[data.weather[0].icon] || '🌡';
            return { temp: data.main.temp, feels: data.main.feels_like, desc: data.weather[0].description, hum: data.main.humidity, wind: data.wind.speed, icon: emoji, sunrise: new Date(data.sys.sunrise * 1000).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}), sunset: new Date(data.sys.sunset * 1000).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) };
        }

        async function getForecast(city) {
            const data = await fetchJSON(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${WEATHER_KEY}&units=metric&lang=ru`);
            const daily = {};
            data.list.forEach(item => { const date = item.dt_txt.split(' ')[0]; const temp = item.main.temp; const icon = item.weather[0].icon; const desc = item.weather[0].description; if (!daily[date]) daily[date] = { min: temp, max: temp, icon: icon, desc: desc }; else { if (temp < daily[date].min) daily[date].min = temp; if (temp > daily[date].max) daily[date].max = temp; } });
            return Object.entries(daily).slice(0, 5).map(([date, d]) => ({ date: date, dateStr: new Date(date).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', weekday:'short'}), min: d.min, max: d.max, icon: mapIcon(d.icon), desc: d.desc }));
        }

        async function getHourlyForDate(city, dateStr) {
            const data = await fetchJSON(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${WEATHER_KEY}&units=metric&lang=ru`);
            return data.list.filter(item => item.dt_txt.startsWith(dateStr)).map(item => ({ time: item.dt_txt.split(' ')[1].slice(0,5), temp: item.main.temp, icon: mapIcon(item.weather[0].icon), desc: item.weather[0].description }));
        }

        function mapIcon(code) { const icons = {'01d':'☀️','01n':'🌙','02d':'⛅','02n':'🌙','03d':'☁','03n':'☁','04d':'☁','04n':'☁','09d':'🌧','09n':'🌧','10d':'🌦','10n':'🌧','11d':'⛈','11n':'⛈','13d':'🌨','13n':'🌨','50d':'🌫','50n':'🌫'}; return icons[code] || '🌡'; }

        async function getRatesData() {
            const cacheKey = 'rates';
            const cached = cacheGet(cacheKey);
            if (cached) return cached;
            const data = await fetchJSON('https://api.exchangerate-api.com/v4/latest/USD');
            const r = data.rates;
            const result = { RUB: r.RUB, KZT: r.KZT, EUR: r.EUR, GBP: r.GBP, CNY: r.CNY, AED: r.AED, TRY: r.TRY, UAH: r.UAH, KGS: r.KGS, UZS: r.UZS, PLN: r.PLN };
            cacheSet(cacheKey, result);
            return result;
        }

        async function loadWeather() {
            const w = await getWeather(currentCity);
            document.getElementById('cityTitle').innerHTML = `🏙 ${currentCityRu}`;
            document.getElementById('weatherCard').innerHTML = `
                <div class="row"><span class="weather-icon">${w.icon}</span><div><span class="temp-big">${w.temp.toFixed(0)}°C</span><div class="feels">Ощущается ${w.feels.toFixed(0)}°C</div></div></div>
                <div style="margin-top:10px;">☁ ${w.desc}</div>
                <div class="grid-2">
                    <div class="detail">💧 Влажность<br><b>${w.hum}%</b></div>
                    <div class="detail">💨 Ветер<br><b>${w.wind} м/с</b></div>
                    <div class="detail">🌅 Восход<br><b>${w.sunrise}</b></div>
                    <div class="detail">🌇 Закат<br><b>${w.sunset}</b></div>
                </div>`;
            const todayStr = new Date().toISOString().slice(0,10);
            const hourly = await getHourlyForDate(currentCity, todayStr);
            const hourlyHtml = hourly.map(h => `
                <div class="hourly-item">
                    <div class="hourly-time">${h.time}</div>
                    <div class="hourly-icon">${h.icon}</div>
                    <div class="hourly-temp">${h.temp.toFixed(0)}°</div>
                </div>
            `).join('');
            document.getElementById('hourlyForecast').innerHTML = `
                <div style="font-weight:600; margin-bottom:8px;">🕒 Почасовой прогноз</div>
                <div class="hourly-scroll">${hourlyHtml}</div>`;
        }

        async function loadForecast() {
            const f = await getForecast(currentCity);
            const html = f.map(d => `
                <div class="forecast-card" onclick="openDayHourly('${d.date}')">
                    <div class="forecast-date">${d.dateStr}</div>
                    <div class="forecast-icon">${d.icon}</div>
                    <div class="forecast-temp">${d.min.toFixed(0)}° … ${d.max.toFixed(0)}°</div>
                    <div class="forecast-desc">${d.desc}</div>
                </div>
            `).join('');
            document.getElementById('forecastCard').innerHTML = `<div class="forecast-grid">${html}</div>`;
        }

        async function loadRates() {
            const r = await getRatesData();
            const safe = (a,b) => b? a/b : 0;
            document.getElementById('ratesCard').innerHTML = `
                <table class="rate-table">
                    <tr><th>Валюта</th><th>USD</th><th>RUB</th><th>KZT</th></tr>
                    <tr><td>🇷🇺 RUB</td><td>${(1/r.RUB).toFixed(4)}</td><td>1.0000</td><td>${(1/(r.RUB/r.KZT)).toFixed(2)}</td></tr>
                    <tr><td>🇰🇿 KZT</td><td>${(1/r.KZT).toFixed(4)}</td><td>${safe(1, r.RUB/r.KZT).toFixed(4)}</td><td>1.0000</td></tr>
                    <tr><td>🇺🇸 USD</td><td>1.0000</td><td>${r.RUB.toFixed(2)}</td><td>${r.KZT.toFixed(2)}</td></tr>
                    <tr><td>🇪🇺 EUR</td><td>${r.EUR.toFixed(4)}</td><td>${safe(r.RUB, r.EUR).toFixed(2)}</td><td>${safe(r.KZT, r.EUR).toFixed(2)}</td></tr>
                    <tr><td>🇬🇧 GBP</td><td>${r.GBP.toFixed(4)}</td><td>${safe(r.RUB, r.GBP).toFixed(2)}</td><td>${safe(r.KZT, r.GBP).toFixed(2)}</td></tr>
                    <tr><td>🇨🇳 CNY</td><td>${r.CNY.toFixed(4)}</td><td>${safe(r.RUB, r.CNY).toFixed(2)}</td><td>${safe(r.KZT, r.CNY).toFixed(2)}</td></tr>
                    <tr><td>🇦🇪 AED</td><td>${r.AED.toFixed(4)}</td><td>${safe(r.RUB, r.AED).toFixed(2)}</td><td>${safe(r.KZT, r.AED).toFixed(2)}</td></tr>
                    <tr><td>🇹🇷 TRY</td><td>${r.TRY.toFixed(4)}</td><td>${safe(r.RUB, r.TRY).toFixed(2)}</td><td>${safe(r.KZT, r.TRY).toFixed(2)}</td></tr>
                    <tr><td>🇺🇦 UAH</td><td>${r.UAH.toFixed(4)}</td><td>${safe(r.RUB, r.UAH).toFixed(2)}</td><td>${safe(r.KZT, r.UAH).toFixed(2)}</td></tr>
                    <tr><td>🇰🇬 KGS</td><td>${r.KGS.toFixed(4)}</td><td>${safe(r.RUB, r.KGS).toFixed(2)}</td><td>${safe(r.KZT, r.KGS).toFixed(2)}</td></tr>
                    <tr><td>🇺🇿 UZS</td><td>${r.UZS.toFixed(0)}</td><td>${safe(r.RUB, r.UZS).toFixed(0)}</td><td>${safe(r.KZT, r.UZS).toFixed(0)}</td></tr>
                    <tr><td>🇵🇱 PLN</td><td>${(1/r.PLN).toFixed(4)}</td><td>${safe(r.RUB, r.PLN).toFixed(2)}</td><td>${safe(r.KZT, r.PLN).toFixed(2)}</td></tr>
                </table>`;
        }

        function swapCurrencies() {
            const from = document.getElementById('convertFrom');
            const to = document.getElementById('convertTo');
            const temp = from.value;
            from.value = to.value;
            to.value = temp;
        }

        function getHistory() { return JSON.parse(localStorage.getItem('convHistory') || '[]'); }
        function addHistory(entry) { let history = getHistory(); history.unshift(entry); if (history.length > 5) history.pop(); localStorage.setItem('convHistory', JSON.stringify(history)); renderHistory(); }
        function clearHistory() { localStorage.removeItem('convHistory'); renderHistory(); }
        function renderHistory() {
            const container = document.getElementById('historyContainer');
            const history = getHistory();
            if (history.length === 0) {
                container.innerHTML = '<div style="color:var(--sub); font-size:14px;">История пуста</div>';
                return;
            }
            let html = '<div style="font-weight:600; margin-bottom:6px;">📋 Последние конвертации:</div>';
            history.forEach(item => html += `<div class="history-item"><span>${item}</span></div>`);
            html += '<button class="clear-history-btn" onclick="clearHistory()">Очистить историю</button>';
            container.innerHTML = html;
        }

        async function doConvert() {
            const amount = +document.getElementById('convertAmount').value;
            const from = document.getElementById('convertFrom').value;
            const to = document.getElementById('convertTo').value;
            if (!amount || amount <= 0) {
                document.getElementById('convertResult').textContent = 'Введите положительную сумму';
                return;
            }
            try {
                const data = await fetchJSON(`https://api.exchangerate-api.com/v4/latest/${from}`);
                const rate = data.rates[to];
                const res = amount * rate;
                const resultText = `${amount} ${from} = ${res.toFixed(2)} ${to}`;
                document.getElementById('convertResult').textContent = resultText;
                addHistory(resultText);
            } catch(e) {
                document.getElementById('convertResult').textContent = 'Ошибка конвертации';
            }
        }

        function openCityModal() { document.getElementById('cityModal').classList.remove('hidden'); document.getElementById('citySearchInput').value = ''; document.getElementById('citySearchInput').focus(); }
        function closeCityModal() { document.getElementById('cityModal').classList.add('hidden'); }
        async function selectCity(eng, ru) { currentCity = eng; currentCityRu = ru; localStorage.setItem('city', currentCity); localStorage.setItem('cityRu', currentCityRu); closeCityModal(); const activeTab = document.querySelector('.tab-content:not(.hidden)'); if (activeTab) switchTab(activeTab.id.replace('tab-','')); else loadWeather(); }

        document.getElementById('citySearchInput').addEventListener('keydown', async function(e) { if (e.key === 'Enter') { const input = this.value.trim(); if (!input) return; try { const data = await fetchJSON(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(input)}&appid=${WEATHER_KEY}&units=metric&lang=ru`); if (data.cod && data.cod !== 200) { alert('Город не найден'); return; } selectCity(data.name || input, data.name || input); } catch (e) { alert('Ошибка при проверке города'); } } });

        async function openDayHourly(dateStr) { document.getElementById('dayHourlyModal').classList.remove('hidden'); document.getElementById('dayHourlyTitle').textContent = `Почасовой прогноз на ${new Date(dateStr).toLocaleDateString('ru-RU')}`; const hourly = await getHourlyForDate(currentCity, dateStr); const content = hourly.map(h => `<div class="hourly-detail-item"><span>${h.time}</span><span>${h.icon} ${h.temp.toFixed(0)}°C</span><span style="color:var(--sub);font-size:14px;">${h.desc}</span></div>`).join(''); document.getElementById('dayHourlyContent').innerHTML = content; }
        function closeDayHourlyModal() { document.getElementById('dayHourlyModal').classList.add('hidden'); }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => { t.classList.add('hidden'); t.classList.remove('active'); });
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            const tabEl = document.getElementById(`tab-${tab}`);
            if (tabEl) { tabEl.classList.remove('hidden'); tabEl.classList.add('active'); }
            const btn = document.querySelector(`.nav-btn[onclick*="switchTab('${tab}')"]`);
            if (btn) btn.classList.add('active');
            if (tab === 'weather') loadWeather();
            else if (tab === 'forecast') loadForecast();
            else if (tab === 'rates') loadRates();
            else if (tab === 'convert') renderHistory();
        }

        loadWeather();
    </script>
</body>
</html>
