<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">

<title>Всё под рукой</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
:root{
--bg:#f2f4f8;
--card:#fff;
--text:#111827;
--sub:#6b7280;
--accent:#2563eb;
--accent-light:#e8f0ff;
--border:#e5e7eb;
--shadow:0 8px 30px rgba(0,0,0,.07);
--radius:24px
}

body.dark{
--bg:#0f172a;
--card:#1e293b;
--text:#f8fafc;
--sub:#94a3b8;
--accent:#60a5fa;
--accent-light:#1e3a5f;
--border:#334155;
--shadow:0 8px 30px rgba(0,0,0,.35)
}

*{
margin:0;
padding:0;
box-sizing:border-box
}

body{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
background:var(--bg);
color:var(--text);
min-height:100vh;
padding-bottom:90px;
transition:.25s
}

.hidden{
display:none!important
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 18px
}

.header h1{
font-size:24px;
font-weight:800
}

.city-btn{
border:0;
background:var(--accent-light);
color:var(--accent);
padding:11px 16px;
border-radius:18px;
font-weight:700
}

.card{
background:var(--card);
margin:0 16px 16px;
padding:20px;
border-radius:var(--radius);
box-shadow:var(--shadow)
}

h2{
font-size:20px;
margin-bottom:15px
}

.weather-main{
text-align:center
}

.weather-icon{
font-size:70px
}

.temperature{
font-size:68px;
font-weight:800;
letter-spacing:-3px
}

.description{
font-size:20px;
color:var(--sub)
}

.feels{
color:var(--sub);
margin-top:8px
}

.weather-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:22px
}

.info-box{
background:var(--accent-light);
padding:14px;
border-radius:18px;
color:var(--sub);
text-align:center
}

.info-box b{
display:block;
font-size:17px;
margin-top:5px;
color:var(--text)
}

.hourly{
display:flex;
gap:12px;
overflow-x:auto
}

.hour{
min-width:75px;
background:var(--accent-light);
padding:12px;
border-radius:18px;
text-align:center
}

.forecast{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.forecast-box{
border:1px solid var(--border);
border-radius:22px;
padding:15px;
text-align:center
}

.forecast-box div{
font-size:35px
}

.input{
width:100%;
padding:14px;
margin-top:10px;
border-radius:16px;
border:1px solid var(--border);
background:var(--bg);
color:var(--text);
font-size:16px
}

.main-btn{
width:100%;
padding:15px;
margin-top:10px;
border:0;
border-radius:18px;
background:var(--accent);
color:white;
font-weight:800;
font-size:16px
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:var(--card);
border-top:1px solid var(--border);
display:flex;
justify-content:space-around;
padding:10px 0 14px
}

.nav button{
background:none;
border:0;
color:#9ca3af;
font-size:12px
}

.nav button.active{
color:var(--accent)
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:flex;
align-items:flex-end;
z-index:1000
}

.modal-box{
background:var(--card);
width:100%;
border-radius:30px 30px 0 0;
padding:25px;
max-height:80vh;
overflow:auto
}

.city-list{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:15px
}

.city-list button{
padding:15px;
border:0;
border-radius:20px;
background:var(--bg)
}

.rate-box{
display:flex;
justify-content:space-between;
padding:15px;
margin-top:10px;
border-radius:18px;
background:var(--accent-light)
}

.history{
margin-top:15px
}

.history-item{
padding:12px;
border-bottom:1px solid var(--border);
color:var(--sub)
}

.close-btn{
width:100%;
margin-top:15px;
padding:15px;
border:0;
border-radius:18px;
background:#ef4444;
color:white
}

</style>
</head>
<body>

<div id="cityModal" class="modal hidden">

<div class="modal-box">

<h2>🌍 Выбор города</h2>

<input id="citySearch" class="input" placeholder="Введите город">


<div class="city-list">

<button onclick="selectCity('Almetyevsk','Альметьевск')">
🇷🇺 Альметьевск
</button>

<button onclick="selectCity('Moscow','Москва')">
🇷🇺 Москва
</button>

<button onclick="selectCity('Kazan','Казань')">
🇷🇺 Казань
</button>

<button onclick="selectCity('Almaty','Алматы')">
🇰🇿 Алматы
</button>

</div>


<button class="main-btn" onclick="searchCity()">
🔍 Найти город
</button>


<button class="close-btn" onclick="closeCity()">
Закрыть
</button>


</div>

</div>



<header class="header">

<h1 id="cityName">
📍 Загрузка...
</h1>


<button class="city-btn" onclick="openCity()">
🌍 Город
</button>


</header>





<section id="weatherTab">


<div class="card weather-main">


<div id="weatherIcon" class="weather-icon">
🌤
</div>


<div id="temperature" class="temperature">
--
</div>


<div id="description" class="description">
Загрузка...
</div>


<div id="feels" class="feels">
Ощущается --
</div>



<div class="weather-grid">


<div class="info-box">
💧 Влажность
<b id="humidity">--</b>
</div>


<div class="info-box">
💨 Ветер
<b id="wind">--</b>
</div>


<div class="info-box">
🌅 Восход
<b id="sunrise">--</b>
</div>


<div class="info-box">
🌇 Закат
<b id="sunset">--</b>
</div>


</div>


</div>



<div class="card">

<h2>
🕒 Сегодня
</h2>


<div id="hourly" class="hourly"></div>


</div>


</section>







<section id="forecastTab" class="hidden">


<div class="card">


<h2>
📅 Прогноз
</h2>


<div id="forecast" class="forecast"></div>


</div>


</section>








<section id="ratesTab" class="hidden">


<div class="card">


<h2>
💵 Курсы валют
</h2>


<button class="main-btn" onclick="loadRates()">
🔄 Обновить
</button>


<div id="rates">

Загрузка...

</div>


</div>


</section>







<section id="convertTab" class="hidden">


<div class="card">


<h2>
💱 Конвертер
</h2>


<input 
id="amount"
class="input"
type="number"
value="100">



<select id="from" class="input">


<option value="USD">
🇺🇸 USD
</option>


<option value="RUB">
🇷🇺 RUB
</option>


<option value="EUR">
🇪🇺 EUR
</option>


<option value="KZT">
🇰🇿 KZT
</option>


</select>




<button class="main-btn" onclick="swap()">
↕ Поменять
</button>




<select id="to" class="input">


<option value="RUB">
🇷🇺 RUB
</option>


<option value="USD">
🇺🇸 USD
</option>


<option value="EUR">
🇪🇺 EUR
</option>


<option value="KZT">
🇰🇿 KZT
</option>


</select>




<button class="main-btn" onclick="convert()">
Конвертировать
</button>



<h3 id="result">

</h3>



<div class="history">

<h3>
🕘 Последние операции
</h3>


<div id="historyList">

История пуста

</div>


<button class="close-btn" onclick="clearHistory()">
Очистить историю
</button>


</div>



</div>


</section>







<nav class="nav">


<button onclick="switchTab('weather')">
☀️
<br>
Погода
</button>



<button onclick="switchTab('forecast')">
📅
<br>
Прогноз
</button>



<button onclick="switchTab('rates')">
💵
<br>
Курсы
</button>



<button onclick="switchTab('convert')">
💱
<br>
Обмен
</button>



</nav>




<script>

const WEATHER_KEY="b87ebb55d538c2d9213edfad793e6bef";


let city=localStorage.getItem("city")||"Almetyevsk";

let cityRu=localStorage.getItem("cityRu")||"Альметьевск";


const tg=window.Telegram.WebApp;


tg.ready();
tg.expand();



function theme(){

document.body.classList.toggle(
"dark",
tg.colorScheme==="dark"
);

}


theme();

tg.onEvent("themeChanged",theme);
function weatherIcon(code){

let i={
"01d":"☀️",
"01n":"🌙",
"02d":"⛅",
"02n":"☁️",
"03d":"☁️",
"03n":"☁️",
"04d":"☁️",
"04n":"☁️",
"09d":"🌧",
"10d":"🌦",
"11d":"⛈",
"13d":"❄️",
"50d":"🌫"
};

return i[code]||"🌡";

}




async function loadWeather(){

try{

let r=await fetch(
`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${WEATHER_KEY}&units=metric&lang=ru`
);

let d=await r.json();


cityName.innerHTML="📍 "+cityRu;

weatherIconEl=document.getElementById("weatherIcon");

weatherIconEl.innerHTML=
weatherIcon(d.weather[0].icon);


temperature.innerHTML=
Math.round(d.main.temp)+"°";


description.innerHTML=
d.weather[0].description;


feels.innerHTML=
"Ощущается "+Math.round(d.main.feels_like)+"°";


humidity.innerHTML=
d.main.humidity+"%";


wind.innerHTML=
d.wind.speed+" м/с";


sunrise.innerHTML=
new Date(d.sys.sunrise*1000)
.toLocaleTimeString("ru-RU",
{hour:"2-digit",minute:"2-digit"});


sunset.innerHTML=
new Date(d.sys.sunset*1000)
.toLocaleTimeString("ru-RU",
{hour:"2-digit",minute:"2-digit"});


loadHourly();


}catch(e){

console.log(e);

}

}





async function loadHourly(){

let r=await fetch(
`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${WEATHER_KEY}&units=metric&lang=ru`
);


let d=await r.json();

let h="";


d.list.slice(0,8).forEach(x=>{

h+=`

<div class="hour">

<b>${x.dt_txt.slice(11,16)}</b>

<br>

${weatherIcon(x.weather[0].icon)}

<br>

${Math.round(x.main.temp)}°

</div>

`;

});


hourly.innerHTML=h;

}





async function loadForecast(){

let r=await fetch(
`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${WEATHER_KEY}&units=metric&lang=ru`
);


let d=await r.json();

let days={};


d.list.forEach(x=>{

let day=x.dt_txt.split(" ")[0];

if(!days[day])
days[day]=x;

});


let h="";


Object.values(days).slice(0,5).forEach(x=>{


h+=`

<div class="forecast-box">

<h3>
${new Date(x.dt*1000)
.toLocaleDateString("ru-RU",
{
weekday:"short",
day:"numeric",
month:"short"
})}
</h3>


<div>
${weatherIcon(x.weather[0].icon)}
</div>


<b>
${Math.round(x.main.temp)}°
</b>


<p>
${x.weather[0].description}
</p>


</div>

`;

});


forecast.innerHTML=h;

}





async function loadRates(){

try{

let r=await fetch(
"https://api.exchangerate-api.com/v4/latest/USD"
);

let d=await r.json();


rates.innerHTML=`

<div class="rate-box">
<span>🇷🇺 RUB</span>
<b>${d.rates.RUB.toFixed(2)}</b>
</div>


<div class="rate-box">
<span>🇪🇺 EUR</span>
<b>${d.rates.EUR.toFixed(2)}</b>
</div>


<div class="rate-box">
<span>🇰🇿 KZT</span>
<b>${d.rates.KZT.toFixed(2)}</b>
</div>


<div class="rate-box">
<span>🇬🇧 GBP</span>
<b>${d.rates.GBP.toFixed(2)}</b>
</div>

`;

}catch(e){

rates.innerHTML="Ошибка загрузки";

}

}





async function convert(){

let amount=
Number(document.getElementById("amount").value);

let from=
document.getElementById("from").value;

let to=
document.getElementById("to").value;


if(!amount)return;


let r=await fetch(
`https://api.exchangerate-api.com/v4/latest/${from}`
);


let d=await r.json();


let resultValue=
amount*d.rates[to];


let text=
`${amount} ${from} = ${resultValue.toFixed(2)} ${to}`;


result.innerHTML=text;


saveHistory(text);

loadHistory();

}




function saveHistory(text){

let h=
JSON.parse(localStorage.getItem("convertHistory")||"[]");


h.unshift(text);


h=h.slice(0,5);


localStorage.setItem(
"convertHistory",
JSON.stringify(h)
);

}





function loadHistory(){

let h=
JSON.parse(localStorage.getItem("convertHistory")||"[]");


if(!h.length){

historyList.innerHTML="История пуста";

return;

}


historyList.innerHTML=
h.map(x=>
`
<div class="history-item">
${x}
</div>
`
).join("");

}





function clearHistory(){

localStorage.removeItem("convertHistory");

loadHistory();

}





function swap(){

let a=from.value;

from.value=to.value;

to.value=a;

}





function openCity(){

cityModal.classList.remove("hidden");

}





function closeCity(){

cityModal.classList.add("hidden");

}





function selectCity(en,ru){

city=en;

cityRu=ru;


localStorage.setItem("city",en);

localStorage.setItem("cityRu",ru);


closeCity();

loadWeather();

}





async function searchCity(){

let q=
document.getElementById("citySearch").value;


if(!q)return;


let r=await fetch(
`https://api.openweathermap.org/data/2.5/weather?q=${q}&appid=${WEATHER_KEY}&lang=ru`
);


let d=await r.json();


if(d.cod!==200){

alert("Город не найден");

return;

}


selectCity(
d.name,
d.name
);

}





function switchTab(tab){


document.querySelectorAll("section")
.forEach(x=>
x.classList.add("hidden")
);


document
.getElementById(tab+"Tab")
.classList.remove("hidden");


if(tab==="weather")
loadWeather();


if(tab==="forecast")
loadForecast();


if(tab==="rates")
loadRates();


if(tab==="convert")
loadHistory();

}





loadWeather();

loadHistory();


</script>

</body>
</html>
