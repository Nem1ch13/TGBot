<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Всё под рукой</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #f5f7fa;
            --card: #ffffff;
            --text: #1a1a1a;
            --sub: #6b7280;
            --accent: #3b82f6;
            --accent-light: #eff6ff;
            --border: #e5e7eb;
            --danger: #ef4444;
            --tab-active: #3b82f6;
            --tab-inactive: #9ca3af;
            --shadow: 0 4px 12px rgba(0,0,0,0.04);
            --radius: 20px;
            --skeleton-base: #e5e7eb;
            --skeleton-shine: #f3f4f6;
        }
        /* Тёмная тема будет применена через JS */
        body.dark {
            --bg: #111827;
            --card: #1f2937;
            --text: #f3f4f6;
            --sub: #9ca3af;
            --accent: #60a5fa;
            --accent-light: #1e3a5f;
            --border: #374151;
            --shadow: 0 4px 12px rgba(0,0,0,0.3);
            --skeleton-base: #374151;
            --skeleton-shine: #4b5563;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding-bottom: 80px;
            transition: background 0.3s, color 0.3s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 10px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .city-select-btn {
            background: var(--accent-light);
            color: var(--accent);
            border: none;
            padding: 10px 18px;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .city-select-btn:active { background: var(--accent); color: white; }
        .card {
            background: var(--card); border-radius: var(--radius); padding: 18px; margin: 0 16px 12px; box-shadow: var(--shadow);
            transition: all 0.3s;
        }
        .weather-icon { font-size: 48px; margin-right: 12px; }
        .temp-big { font-size: 42px; font-weight: 700; }
        .feels { color: var(--sub); font-size: 14px; }
        .row { display: flex; align-items: center; flex-wrap: wrap; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
        .detail { font-size: 14px; color: var(--sub); }
        .detail b { color: var(--text); font-weight: 600; }
        .nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--card); border-top: 1px solid var(--border);
            display: flex; justify-content: space-around; padding: 8px 0 12px;
            backdrop-filter: blur(12px); transition: background 0.3s;
        }
        .nav-btn {
            background: none; border: none; color: var(--tab-inactive);
            font-size: 11px; display: flex; flex-direction: column; align-items: center;
            gap: 4px; cursor: pointer; transition: color 0.2s; padding: 4px 8px;
        }
        .nav-btn.active { color: var(--tab-active); font-weight: 600; }
        .nav-btn svg { width: 24px; height: 24px; }

        .hourly-scroll {
            display: flex; overflow-x: auto; gap: 12px; padding-bottom: 8px; margin-top: 12px;
            -webkit-overflow-scrolling: touch;
        }
        .hourly-item {
            min-width: 70px; text-align: center; padding: 8px 6px; border-radius: 12px;
            background: var(--accent-light); flex-shrink: 0;
        }
        .hourly-time { font-size: 13px; color: var(--sub); margin-bottom: 4px; }
        .hourly-icon { font-size: 24px; }
        .hourly-temp { font-weight: 600; margin-top: 4px; }

        .forecast-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px;
        }
        .forecast-card {
            background: var(--card); border-radius: 16px; padding: 14px; text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); border: 1px solid var(--border);
            cursor: pointer; transition: transform 0.15s;
        }
        .forecast-card:active { transform: scale(0.97); }
        .forecast-date { font-size: 13px; color: var(--sub); margin-bottom: 6px; }
        .forecast-icon { font-size: 32px; margin: 4px 0; }
        .forecast-temp { font-size: 18px; font-weight: 700; margin: 4px 0; }
        .forecast-desc { font-size: 12px; color: var(--sub); text-transform: capitalize; }

        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); display: flex; align-items: flex-end; justify-content: center;
            z-index: 1000; animation: fadeIn 0.2s ease;
        }
        @keyframes fadeIn { from { opacity: 0; } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } }
        .tab-content.active { animation: fadeInUp 0.25s ease; }
        .modal {
            background: var(--card); border-radius: 24px 24px 0 0; padding: 24px 20px 30px;
            width: 100%; max-width: 500px; max-height: 80vh; overflow-y: auto;
            box-shadow: 0 -8px 30px rgba(0,0,0,0.15);
        }
        .modal-handle {
            width: 40px; height: 4px; background: var(--border); border-radius: 2px;
            margin: 0 auto 16px;
        }
        .modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 16px; }
        .city-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px;
        }
        .city-card {
            background: var(--bg); border-radius: 14px; padding: 14px; text-align: center;
            cursor: pointer; transition: background 0.15s;
            border: 1px solid transparent;
        }
        .city-card:active { background: var(--accent-light); border-color: var(--accent); }
        .city-flag { font-size: 28px; margin-bottom: 4px; }
        .city-name { font-weight: 600; font-size: 16px; }
        .search-box {
            width: 100%; padding: 12px 16px; border-radius: 14px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 16px; margin-bottom: 12px;
            outline: none;
        }
        .search-box:focus { border-color: var(--accent); }

        .rate-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
        .rate-table th, .rate-table td { padding: 6px 4px; text-align: right; }
        .rate-table th { color: var(--sub); font-weight: 500; border-bottom: 1px solid var(--border); }
        .rate-table td:first-child, .rate-table th:first-child { text-align: left; }
        .refresh-btn {
            background: none; border: 1px solid var(--border); color: var(--text);
            padding: 4px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
            margin-bottom: 8px; display: inline-flex; align-items: center; gap: 4px;
        }
        .converter { display: flex; flex-direction: column; gap: 8px; }
        .converter input, .converter select, .converter button {
            padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border);
            background: var(--bg); color: var(--text); font-size: 15px;
        }
        .converter button { background: var(--accent); color: white; border: none; font-weight: 600; cursor: pointer; }
        .swap-btn {
            background: var(--accent-light); color: var(--accent); border: none;
            width: 40px; height: 40px; border-radius: 20px; font-size: 20px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            margin: 0 auto; transition: transform 0.2s;
        }
        .swap-btn:active { transform: rotate(180deg); }
        .hidden { display: none !important; }
        canvas { margin-top: 12px; }
        .news-item { margin-bottom: 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
        .news-item:last-child { border-bottom: none; }
        .news-link { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 15px; }
        .news-date { font-size: 12px; color: var(--sub); margin-top: 4px; }
        .history-item { padding: 6px 0; font-size: 14px; border-bottom: 1px solid var(--border); }
        .history-item:last-child { border-bottom: none; }
        .clear-history-btn { background: none; border: none; color: var(--danger); font-size: 13px; cursor: pointer; padding: 4px 8px; margin-top: 8px; }
        
        /* Skeleton Loading */
        .skeleton {
            background: linear-gradient(90deg, var(--skeleton-base) 25%, var(--skeleton-shine) 50%, var(--skeleton-base) 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
            border-radius: 8px;
        }
        @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    </style>
</head>
<body>
    <!-- Модалка выбора города -->
    <div id="cityModal" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-handle"></div>
            <h3>🌍 Выберите город</h3>
            <input type="text" id="citySearchInput" class="search-box" placeholder="Поиск города...">
            <div class="city-grid" id="popularCitiesGrid">
                <div class="city-card" onclick="selectCity('Almetyevsk', 'Альметьевск')"><div class="city-flag">🇷🇺</div><div class="city-name">Альметьевск</div></div>
                <div class="city-card" onclick="selectCity('Shymkent', 'Шымкент')"><div class="city-flag">🇰🇿</div><div class="city-name">Шымкент</div></div>
                <div class="city-card" onclick="selectCity('Moscow', 'Москва')"><div class="city-flag">🇷🇺</div><div class="city-name">Москва</div></div>
                <div class="city-card" onclick="selectCity('Almaty', 'Алматы')"><div class="city-flag">🇰🇿</div><div class="city-name">Алматы</div></div>
                <div class="city-card" onclick="selectCity('Astana', 'Астана')"><div class="city-flag">🇰🇿</div><div class="city-name">Астана</div></div>
            </div>
        </div>
    </div>

    <!-- Модалка почасового прогноза -->
    <div id="dayHourlyModal" class="modal-overlay hidden">
        <div class="modal" style="border-radius: 24px; max-height: 70vh;">
            <button class="modal-close" onclick="closeDayHourlyModal()">✕</button>
            <h3 id="dayHourlyTitle">Почасовой прогноз</h3>
            <div id="dayHourlyContent"></div>
        </div>
    </div>

    <div class="header">
        <h1 id="cityTitle">🏙 Загрузка...</h1>
        <button class="city-select-btn" onclick="openCityModal()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            Выбрать город
        </button>
    </div>

    <!-- Вкладки -->
    <div id="tab-weather" class="tab-content active">
        <div class="card" id="weatherCard"><div class="skeleton" style="height:120px;"></div></div>
        <div class="card" id="hourlyCard" style="margin-top:0;"><div id="hourlyForecast"></div></div>
    </div>
    <div id="tab-forecast" class="tab-content hidden">
        <div class="card"><div id="forecastCard"><div class="skeleton" style="height:200px;"></div></div></div>
    </div>
    <div id="tab-news" class="tab-content hidden">
        <div class="card" id="newsCard"><div class="skeleton" style="height:200px;"></div></div>
    </div>
    <div id="tab-rates" class="tab-content hidden">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span style="font-weight:600;">💵 Курсы валют</span>
                <button class="refresh-btn" onclick="loadRates()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    Обновить
                </button>
            </div>
            <div id="ratesCard"><div class="skeleton" style="height:200px;"></div></div>
        </div>
    </div>
    <div id="tab-convert" class="tab-content hidden">
        <div class="card">
            <div class="converter">
                <input type="number" id="convertAmount" placeholder="Сумма" value="100">
                <select id="convertFrom">
                    <option value="RUB">🇷🇺 RUB - Рубль</option><option value="KZT">🇰🇿 KZT - Тенге</option><option value="USD">🇺🇸 USD - Доллар</option><option value="EUR">🇪🇺 EUR - Евро</option><option value="GBP">🇬🇧 GBP - Фунт</option><option value="PLN">🇵🇱 PLN - Злотый</option><option value="CNY">🇨🇳 CNY - Юань</option><option value="TRY">🇹🇷 TRY - Лира</option><option value="UAH">🇺🇦 UAH - Гривна</option>
                </select>
                <button class="swap-btn" onclick="swapCurrencies()">↕️</button>
                <select id="convertTo">
                    <option value="KZT">🇰🇿 KZT - Тенге</option><option value="RUB">🇷🇺 RUB - Рубль</option><option value="USD">🇺🇸 USD - Доллар</option><option value="EUR">🇪🇺 EUR - Евро</option><option value="GBP">🇬🇧 GBP - Фунт</option><option value="PLN">🇵🇱 PLN - Злотый</option><option value="CNY">🇨🇳 CNY - Юань</option><option value="TRY">🇹🇷 TRY - Лира</option><option value="UAH">🇺🇦 UAH - Гривна</option>
                </select>
                <button onclick="doConvert()">Конвертировать</button>
                <div id="convertResult" style="font-weight:600; margin-top:4px;"></div>
                <div id="historyContainer" style="margin-top:12px;"></div>
            </div>
        </div>
    </div>
    <div id="tab-chart" class="tab-content hidden">
        <div class="card">
            <canvas id="tempChart" height="200"></canvas>
        </div>
    </div>

    <!-- Навигация -->
    <div class="nav">
        <button class="nav-btn active" onclick="switchTab('weather')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7 1.79 1.8 1.41-1.41-1.8-1.79-1.4 1.4zM20 10.5v2h3v-2h-3zm-8-5c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm-1 16.95h2V19.5h-2v2.95zm-7.45-3.91 1.41 1.41 1.79-1.8-1.41-1.41-1.79 1.8z"/></svg>Погода</button>
        <button class="nav-btn" onclick="switchTab('forecast')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>Прогноз</button>
        <button class="nav-btn" onclick="switchTab('news')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M22 3l-1.67 1.67L18.67 3 17 4.67 15.33 3l-1.66 1.67L12 3l-1.67 1.67L8.67 3 7 4.67 5.33 3 3.67 4.67 2 3v16c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V3zM11 19H4v-6h7v6zm9 0h-7v-2h7v2zm0-4h-7v-2h7v2zm0-4H4V8h16v3z"/></svg>Новости</button>
        <button class="nav-btn" onclick="switchTab('rates')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11.8 10.9c-2.27-.59-3-1.2-3-2.15 0-1.09 1.01-1.85 2.7-1.85 1.78 0 2.44.85 2.5 2.1h2.21c-.07-1.72-1.12-3.3-3.21-3.81V3h-3v2.16c-1.94.42-3.5 1.68-3.5 3.61 0 2.31 1.91 3.46 4.7 4.13 2.5.6 3 1.48 3 2.41 0 .69-.49 1.79-2.7 1.79-2.06 0-2.87-.92-2.98-2.1h-2.2c.12 2.19 1.76 3.42 3.68 3.83V21h3v-2.15c1.95-.37 3.5-1.5 3.5-3.55 0-2.84-2.43-3.81-4.7-4.4z"/></svg>Курсы</button>
        <button class="nav-btn" onclick="switchTab('convert')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1.41 16.09V20h-2.67v-1.93c-1.71-.36-3.16-1.46-3.27-3.4h1.96c.1 1.05.82 1.87 2.65 1.87 1.96 0 2.4-.98 2.4-1.59 0-.83-.44-1.61-2.67-2.14-2.48-.6-4.18-1.62-4.18-3.67 0-1.72 1.39-2.84 3.11-3.21V4h2.67v1.95c1.86.45 2.79 1.86 2.85 3.39H14.3c-.05-1.11-.64-1.87-2.22-1.87-1.5 0-2.4.68-2.4 1.64 0 .84.65 1.39 2.67 1.91s4.18 1.39 4.18 3.91c-.01 1.83-1.38 2.83-3.12 3.16z"/></svg>Конвертер</button>
        <button class="nav-btn" onclick="switchTab('chart')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/></svg>График</button>
    </div>

    <script>
        const WEATHER_KEY = 'b87ebb55d538c2d9213edfad793e6bef';
        let currentCity = localStorage.getItem('city') || 'Almetyevsk';
        let currentCityRu = localStorage.getItem('cityRu') || 'Альметьевск';
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // Автоматическая тема Telegram
        function applyTheme() {
            if (tg.colorScheme === 'dark') document.body.classList.add('dark');
            else document.body.classList.remove('dark');
        }
        tg.onEvent('themeChanged', applyTheme);
        applyTheme();

        async function fetchJSON(url) {
            const res = await fetch(url);
            if (!res.ok) throw new Error('Network error');
            return res.json();
        }

        async function getWeather(city) { /* без изменений */
            const data = await fetchJSON(`https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${WEATHER_KEY}&units=metric&lang=ru`);
            const emoji = {'01d':'☀️','01n':'🌙','02d':'⛅','02n':'🌙','03d':'☁','03n':'☁','04d':'☁','04n':'☁','09d':'🌧','09n':'🌧','10d':'🌦','10n':'🌧','11d':'⛈','11n':'⛈','13d':'🌨','13n':'🌨','50d':'🌫','50n':'🌫'}[data.weather[0].icon] || '🌡';
            return { temp: data.main.temp, feels: data.main.feels_like, desc: data.weather[0].description, hum: data.main.humidity, wind: data.wind.speed, icon: emoji, sunrise: new Date(data.sys.sunrise * 1000).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}), sunset: new Date(data.sys.sunset * 1000).toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit'}) };
        }

        async function getForecast(city) { /* без изменений */
            const data = await fetchJSON(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${WEATHER_KEY}&units=metric&lang=ru`);
            const daily = {};
            data.list.forEach(item => { const date = item.dt_txt.split(' ')[0]; const temp = item.main.temp; const icon = item.weather[0].icon; const desc = item.weather[0].description; if (!daily[date]) daily[date] = { min: temp, max: temp, icon: icon, desc: desc }; else { if (temp < daily[date].min) daily[date].min = temp; if (temp > daily[date].max) daily[date].max = temp; } });
            return Object.entries(daily).slice(0, 5).map(([date, d]) => ({ date: date, dateStr: new Date(date).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', weekday:'short'}), min: d.min, max: d.max, icon: mapIcon(d.icon), desc: d.desc }));
        }

        async function getHourlyForDate(city, dateStr) { /* без изменений */
            const data = await fetchJSON(`https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${WEATHER_KEY}&units=metric&lang=ru`);
            return data.list.filter(item => item.dt_txt.startsWith(dateStr)).map(item => ({ time: item.dt_txt.split(' ')[1].slice(0,5), temp: item.main.temp, icon: mapIcon(item.weather[0].icon), desc: item.weather[0].description }));
        }

        function mapIcon(code) { const icons = {'01d':'☀️','01n':'🌙','02d':'⛅','02n':'🌙','03d':'☁','03n':'☁','04d':'☁','04n':'☁','09d':'🌧','09n':'🌧','10d':'🌦','10n':'🌧','11d':'⛈','11n':'⛈','13d':'🌨','13n':'🌨','50d':'🌫','50n':'🌫'}; return icons[code] || '🌡'; }

        async function getNews(city) { /* без изменений */ 
            const url = `https://news.google.com/rss/search?q=${encodeURIComponent(city)}&hl=ru&gl=RU&ceid=RU:ru`; const response = await fetch(url); const text = await response.text(); const parser = new DOMParser(); const xml = parser.parseFromString(text, "application/xml"); const items = xml.querySelectorAll("item"); if (!items.length) return [{title: 'Новостей не найдено', link: '#', date: ''}]; return Array.from(items).slice(0, 5).map(item => { const title = item.querySelector("title")?.textContent || ''; const link = item.querySelector("link")?.textContent || '#'; const pubDate = item.querySelector("pubDate")?.textContent || ''; const date = pubDate ? new Date(pubDate).toLocaleDateString('ru-RU', {day:'2-digit', month:'2-digit', year:'numeric'}) : ''; return { title, link, date }; });

        async function selectCity(eng, ru) { currentCity = eng; currentCityRu = ru; localStorage.setItem('city', currentCity); localStorage.setItem('cityRu', currentCityRu); closeCityModal(); const activeTab = document.querySelector('.tab-content:not(.hidden)'); if (activeTab) switchTab(activeTab.id.replace('tab-','')); else loadWeather(); }

        document.getElementById('citySearchInput').addEventListener('keydown', async function(e) { if (e.key === 'Enter') { const input = this.value.trim(); if (!input) return; try { const data = await fetchJSON(`https://api.openweathermap.org/data/2.5/weather?q=${encodeURIComponent(input)}&appid=${WEATHER_KEY}&units=metric&lang=ru`); if (data.cod && data.cod !== 200) { alert('Город не найден'); return; } selectCity(data.name || input, data.name || input); } catch (e) { alert('Ошибка при проверке города'); } } });

        async function openDayHourly(dateStr) { document.getElementById('dayHourlyModal').classList.remove('hidden'); document.getElementById('dayHourlyTitle').textContent = `Почасовой прогноз на ${new Date(dateStr).toLocaleDateString('ru-RU')}`; const hourly = await getHourlyForDate(currentCity, dateStr); const content = hourly.map(h => `<div class="hourly-detail-item"><span>${h.time}</span><span>${h.icon} ${h.temp.toFixed(0)}°C</span><span style="color:var(--sub);font-size:14px;">${h.desc}</span></div>`).join(''); document.getElementById('dayHourlyContent').innerHTML = content; }
        function closeDayHourlyModal() { document.getElementById('dayHourlyModal').classList.add('hidden'); }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => { t.classList.add('hidden'); t.classList.remove('active'); });
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            const tabEl = document.getElementById(`tab-${tab}`);
            if (tabEl) { tabEl.classList.remove('hidden'); tabEl.classList.add('active'); }
            const btn = document.querySelector(`.nav-btn[onclick*="switchTab('${tab}')"]`);
            if (btn) btn.classList.add('active');
            if (tab === 'weather') loadWeather();
            else if (tab === 'forecast') loadForecast();
            else if (tab === 'news') loadNews();
            else if (tab === 'rates') loadRates();
            else if (tab === 'convert') renderHistory();
            else if (tab === 'chart') loadChart();
        }
