<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>График погоды</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
    <style>
        body { font-family: -apple-system, sans-serif; margin: 16px; }
        canvas { max-width: 100%; margin-top: 20px; }
    </style>
</head>
<body>
    <h2 id="cityName">Загрузка...</h2>
    <canvas id="tempChart"></canvas>
    <script>
        const WEATHER_KEY = 'b87ebb55d538c2d9213edfad793e6bef';
        const params = new URLSearchParams(window.location.search);
        const city = params.get('city') || 'Almetyevsk';
        document.getElementById('cityName').textContent = `Прогноз для ${city}`;
        async function fetchForecast() {
            const url = `https://api.openweathermap.org/data/2.5/forecast?q=${city}&appid=${WEATHER_KEY}&units=metric&lang=ru`;
            const res = await fetch(url);
            const data = await res.json();
            const daily = {};
            data.list.forEach(item => {
                const date = item.dt_txt.split(' ')[0];
                const temp = item.main.temp;
                if (!daily[date]) daily[date] = { min: temp, max: temp };
                else {
                    if (temp < daily[date].min) daily[date].min = temp;
                    if (temp > daily[date].max) daily[date].max = temp;
                }
            });
            const labels = Object.keys(daily).slice(0, 5);
            const min = labels.map(d => daily[d].min);
            const max = labels.map(d => daily[d].max);
            new Chart(document.getElementById('tempChart'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [
                        { label: 'Мин.', data: min, borderColor: '#36a2eb' },
                        { label: 'Макс.', data: max, borderColor: '#ff6384' }
                    ]
                }
            });
        }
        fetchForecast();
    </script>
</body>
</html>
